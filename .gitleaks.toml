# Config de gitleaks: reglas por defecto + reglas propias del proyecto.
[extend]
useDefault = true

[[rules]]
id = "google-oauth-client-secret"
description = "Secreto de cliente OAuth de Google"
regex = '''GOCSPX-[A-Za-z0-9_-]{20,}'''
keywords = ["gocspx"]

[[rules]]
id = "supabase-secret-key"
description = "Clave secreta / service_role de Supabase"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
